<div class="container-xl">
  <div class="filters-row">
    <mat-form-field class="players-filter search-filter" autocomplete="off">
      <mat-label>Recherche</mat-label>
      <input matInput type="text" [(ngModel)]="searchText" (keyup)="applyFilters()" placeholder="Recherchez par équipe ou nom de joueur" autocomplete="off">
    </mat-form-field>

    <mat-form-field class="players-filter">
      <mat-label>&Eacute;quipe</mat-label>
      <mat-select multiple [(ngModel)]="selectedTeamIds" (selectionChange)="applyFilters()">
        <mat-option [value]="team.teamID" *ngFor="let team of teamOptions">{{ team.teamCity }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field class="players-filter">
      <mat-label>Position</mat-label>
      <mat-select multiple [(ngModel)]="selectedPositions" (selectionChange)="applyFilters()">
        <mat-option [value]="position" *ngFor="let position of positionOptions">{{ position }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field class="players-filter">
      <mat-label>Statut</mat-label>
      <mat-select multiple [(ngModel)]="selectedStatuses" (selectionChange)="applyFilters()">
        <mat-option [value]="status" *ngFor="let status of statusOptions">{{ status }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="filters-summary">
    <span>{{ dataSource.filteredData.length }} joueur(s)</span>
    <button mat-button color="primary" *ngIf="hasActiveFilters" (click)="resetFilters()">R&eacute;initialiser les filtres</button>
  </div>

  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort multiTemplateDataRows>

      <!--['team', 'name','position','overall', 'age', 'status']-->
      <ng-container matColumnDef="teamCity">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>&Eacute;quipe</th>
        <td mat-cell *matCellDef="let element"> {{element.teamCity}} </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nom</th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>

      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Position </th>
        <td mat-cell *matCellDef="let element"> {{element.position}} </td>
      </ng-container>

      <ng-container matColumnDef="OVK">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="colonne-centered"> Overall </th>
        <td mat-cell *matCellDef="let element"> {{element.OVK}} </td>
      </ng-container>

      <ng-container matColumnDef="age">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="colonne-centered"> Age </th>
        <td mat-cell *matCellDef="let element"> {{element.age}} </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Statut </th>
        <td mat-cell *matCellDef="let element">
          <div *ngIf="element.status === 'UFA'">
            <button mat-flat-button color="primary">{{element.status}}</button>
          </div>
          <div *ngIf="element.status === 'RFA'">
            <button mat-flat-button color="accent">{{element.status}}</button>
          </div>
          <div *ngIf="element.status === '35+'">
            <button mat-flat-button color="warn">{{element.status}}</button>
          </div>
          <div *ngIf="element.status === 'Signed'">
            <button mat-flat-button>{{element.status}}</button>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="expSalary">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Salaire Attendu </th>
        <td mat-cell *matCellDef="let element"> {{element.expSalary}} </td>
      </ng-container>

      <ng-container matColumnDef="expandedDetail">
        <td mat-cell *matCellDef="let element" [attr.colspan]="displayedColumns.length">
          <div class="example-element-detail"
           [@detailExpand]="element == expandedElement ? 'expanded' : 'collapsed'">
           <app-table-player-detail style="width: 100%;" [player]="element" [connectedTeam]="connectedUserTeam" ></app-table-player-detail>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"
      class="example-element-row"
      [class.example-expanded-row]="expandedElement === row"
      (click)="expandedElement = expandedElement === row ? null : row"></tr>
      <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>
    </table>
  </div>
</div>
